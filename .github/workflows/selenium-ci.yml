
name: Selenium Maven CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-tests:
    name: Run Selenium tests on Chrome
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # env:
    #   BASE_URL: ${{ vars.BASE_URL || 'baseUrl=https://restful-api.dev' }}
    #   HEADLESS: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show environment versions
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run Selenium TestNG tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Generate HTML test report
        if: always()
        run: mvn --batch-mode --no-transfer-progress surefire-report:report-only
        continue-on-error: true

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selenium-test-results
          path: |
            target/surefire-reports/
            target/reports/
            target/screenshots/
          if-no-files-found: warn
          retention-days: 14